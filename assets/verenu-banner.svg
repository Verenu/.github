<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Verenu — talk once, keep moving</title>
  <desc id="d">Banner for Verenu, an open-source local-first desktop dictation app for Windows and macOS.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2522"/>
      <stop offset="1" stop-color="#1b1513"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7553d"/>
      <stop offset=".5" stop-color="#ef9a76"/>
      <stop offset="1" stop-color="#c7553d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d97757" stop-opacity=".30"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <ellipse cx="932" cy="200" rx="420" ry="300" fill="url(#glow)"/>
    <g fill="none" stroke="#d97757" stroke-opacity=".10" stroke-width="1.5">
      <circle cx="932" cy="200" r="210"/>
      <circle cx="932" cy="200" r="285"/>
      <circle cx="932" cy="200" r="360"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="398.5" rx="29.25" fill="none" stroke="#4a3b35"/>

  <!-- left column -->
  <circle cx="84" cy="87" r="4" fill="#ef9a76"/>
  <text x="100" y="92" fill="#a3907f" font-size="13" font-weight="600" letter-spacing="3.2">OPEN SOURCE · LOCAL FIRST · WINDOWS &amp; MACOS</text>

  <text x="78" y="176" fill="#fffaf2" font-size="74" font-weight="700" letter-spacing="-3">Verenu</text>
  <text x="80" y="222" fill="#ef9a76" font-size="29" font-weight="600" letter-spacing="-.6">Talk once. Keep moving.</text>

  <text x="80" y="262" fill="#b8a698" font-size="16.5">Hold a hotkey, speak naturally, and clean text lands in the app</text>
  <text x="80" y="286" fill="#b8a698" font-size="16.5">you were already using. No subscription. No telemetry.</text>

  <g font-size="13" font-weight="600" text-anchor="middle">
    <g fill="#332a26" stroke="#4d3f39">
      <rect x="80" y="318" width="122" height="34" rx="17"/>
      <rect x="212" y="318" width="158" height="34" rx="17"/>
      <rect x="380" y="318" width="176" height="34" rx="17"/>
    </g>
    <g fill="#d9c8bc" stroke="none">
      <text x="141" y="340">Tauri + Rust</text>
      <text x="291" y="340">Local Parakeet V3</text>
      <text x="468" y="340">Bring your own keys</text>
    </g>
  </g>

  <!-- app window -->
  <g>
    <rect x="744" y="88" width="376" height="224" rx="20" fill="#342b27" stroke="#4d3f39"/>
    <circle cx="770" cy="114" r="5" fill="#d97757"/>
    <circle cx="788" cy="114" r="5" fill="#5b4b43"/>
    <circle cx="806" cy="114" r="5" fill="#5b4b43"/>
    <text x="1098" y="119" text-anchor="end" fill="#8a776a" font-size="11" font-weight="600" letter-spacing="1.6">LISTENING</text>
    <line x1="744" y1="136" x2="1120" y2="136" stroke="#4d3f39"/>

    <g fill="url(#wave)">
      <rect x="779" y="190" width="6" height="12" rx="3"/>
      <rect x="794" y="186" width="6" height="20" rx="3"/>
      <rect x="809" y="179" width="6" height="34" rx="3"/>
      <rect x="824" y="183" width="6" height="26" rx="3"/>
      <rect x="839" y="171" width="6" height="50" rx="3"/>
      <rect x="854" y="162" width="6" height="68" rx="3"/>
      <rect x="869" y="174" width="6" height="44" rx="3"/>
      <rect x="884" y="156" width="6" height="80" rx="3"/>
      <rect x="899" y="167" width="6" height="58" rx="3"/>
      <rect x="914" y="150" width="6" height="92" rx="3"/>
      <rect x="929" y="146" width="6" height="100" rx="3"/>
      <rect x="944" y="150" width="6" height="92" rx="3"/>
      <rect x="959" y="167" width="6" height="58" rx="3"/>
      <rect x="974" y="156" width="6" height="80" rx="3"/>
      <rect x="989" y="174" width="6" height="44" rx="3"/>
      <rect x="1004" y="162" width="6" height="68" rx="3"/>
      <rect x="1019" y="171" width="6" height="50" rx="3"/>
      <rect x="1034" y="183" width="6" height="26" rx="3"/>
      <rect x="1049" y="179" width="6" height="34" rx="3"/>
      <rect x="1064" y="186" width="6" height="20" rx="3"/>
      <rect x="1079" y="190" width="6" height="12" rx="3"/>
    </g>

    <rect x="779" y="264" width="248" height="10" rx="5" fill="#544641"/>
    <rect x="779" y="284" width="152" height="10" rx="5" fill="#544641"/>
    <rect x="939" y="281" width="3" height="16" rx="1.5" fill="#ef9a76"/>
  </g>
</svg>
