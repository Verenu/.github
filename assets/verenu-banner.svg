<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Verenu, voice that stays in your flow</title>
  <desc id="desc">A warm editorial banner for Verenu, an open-source local-first AI dictation app.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f1ebe3"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef9a76"/>
      <stop offset="1" stop-color="#c7553d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6f594d" flood-opacity=".15"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#c7553d" opacity=".18"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#paper)"/>
  <rect x="920" y="0" width="280" height="360" rx="28" fill="url(#dots)"/>
  <path d="M0 306C170 260 280 350 430 310S690 252 840 304" fill="none" stroke="#ead9cc" stroke-width="2"/>
  <path d="M0 326C160 280 290 370 445 327S680 275 840 322" fill="none" stroke="#ef9a76" stroke-width="2" opacity=".5"/>

  <g transform="translate(72 62)">
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="26" height="64" rx="13" fill="#d97757"/>
      <rect x="38" y="-26" width="26" height="90" rx="13" fill="#d97757"/>
      <rect x="76" y="-52" width="26" height="116" rx="13" fill="url(#coral)"/>
      <rect x="114" y="-13" width="26" height="77" rx="13" fill="#d97757"/>
      <rect x="152" y="18" width="26" height="46" rx="13" fill="#d97757"/>
    </g>
    <text x="208" y="45" fill="#2b2422" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="-2">Verenu</text>
    <text x="210" y="74" fill="#7e7266" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2.4">OPEN SOURCE  /  LOCAL FIRST</text>

    <text x="0" y="166" fill="#2b2422" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.8">Voice that stays</text>
    <text x="0" y="218" fill="#c7553d" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.8">in your flow.</text>
    <text x="3" y="246" fill="#5f554f" font-family="Segoe UI, Arial, sans-serif" font-size="16">Hold a hotkey. Speak naturally. Get polished text where you work.</text>
  </g>

  <g transform="translate(948 78)" filter="url(#shadow)">
    <rect width="174" height="204" rx="30" fill="#2b2422"/>
    <circle cx="87" cy="82" r="54" fill="#3b302c" stroke="#594740" stroke-width="2"/>
    <path d="M87 51v63M72 70v29a15 15 0 0 0 30 0V70" fill="none" stroke="#fffaf2" stroke-width="8" stroke-linecap="round"/>
    <path d="M60 101a27 27 0 0 0 54 0M87 128v18M72 146h30" fill="none" stroke="#ef9a76" stroke-width="6" stroke-linecap="round"/>
    <circle cx="34" cy="34" r="5" fill="#ef9a76"/>
    <circle cx="140" cy="170" r="5" fill="#ef9a76"/>
    <text x="87" y="187" text-anchor="middle" fill="#fffaf2" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2">SPEAK FREELY</text>
  </g>

  <g transform="translate(74 322)">
    <rect width="94" height="25" rx="12.5" fill="#fffaf2" stroke="#e2d3c7"/>
    <text x="47" y="17" text-anchor="middle" fill="#5f554f" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">WINDOWS</text>
    <rect x="104" width="84" height="25" rx="12.5" fill="#fffaf2" stroke="#e2d3c7"/>
    <text x="146" y="17" text-anchor="middle" fill="#5f554f" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">macOS</text>
    <rect x="198" width="136" height="25" rx="12.5" fill="#fffaf2" stroke="#e2d3c7"/>
    <text x="266" y="17" text-anchor="middle" fill="#5f554f" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">BRING YOUR KEYS</text>
  </g>
</svg>

