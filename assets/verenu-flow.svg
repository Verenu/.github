<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How Verenu works</title>
  <desc id="d">Four steps: hold the hotkey, speak naturally, transcribe and clean, then paste into the focused app.</desc>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#d9a48f"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="1199" height="279" rx="26" fill="#fdf8f2" stroke="#ecdfd3"/>

  <text x="56" y="48" fill="#2b2422" font-size="21" font-weight="700" letter-spacing="-.4">From thought to text</text>
  <text x="56" y="72" fill="#8a7b70" font-size="13.5">A four-step loop that never takes you out of the app you are already in.</text>

  <g stroke="#d9a48f" stroke-width="1.6" stroke-dasharray="5 6" marker-end="url(#tip)">
    <line x1="241" y1="140" x2="416" y2="140"/>
    <line x1="511" y1="140" x2="686" y2="140"/>
    <line x1="781" y1="140" x2="956" y2="140"/>
  </g>

  <g text-anchor="middle">
    <!-- 01 hold the hotkey -->
    <g>
      <circle cx="195" cy="140" r="32" fill="#fbe4d9" stroke="#f0c5b1"/>
      <g>
        <rect x="176" y="128" width="38" height="24" rx="6" fill="none" stroke="#c7553d" stroke-width="2.2"/>
        <g fill="#c7553d">
          <rect x="181.5" y="133" width="5" height="4.5" rx="1.5"/>
          <rect x="189.5" y="133" width="5" height="4.5" rx="1.5"/>
          <rect x="197.5" y="133" width="5" height="4.5" rx="1.5"/>
          <rect x="205.5" y="133" width="5" height="4.5" rx="1.5"/>
          <rect x="181.5" y="141.5" width="8" height="5.5" rx="2"/>
          <rect x="192.5" y="141.5" width="17" height="5.5" rx="2"/>
        </g>
      </g>
      <text x="195" y="200" fill="#c7553d" font-size="11" font-weight="700" letter-spacing="2.4">STEP 01</text>
      <text x="195" y="226" fill="#2b2422" font-size="16.5" font-weight="700">Hold the hotkey</text>
      <text x="195" y="250" fill="#8a7b70" font-size="12.5">Ctrl+Win on Windows, Fn+Ctrl on macOS</text>
    </g>

    <!-- 02 speak naturally -->
    <g>
      <circle cx="465" cy="140" r="32" fill="#dcebe7" stroke="#b6d3cd"/>
      <g fill="none" stroke="#376d6a" stroke-width="2.4" stroke-linecap="round">
        <rect x="458" y="122" width="14" height="24" rx="7" fill="#376d6a" stroke="none"/>
        <path d="M453 142a12 12 0 0 0 24 0"/>
        <path d="M465 154v8M457 162h16"/>
      </g>
      <text x="465" y="200" fill="#376d6a" font-size="11" font-weight="700" letter-spacing="2.4">STEP 02</text>
      <text x="465" y="226" fill="#2b2422" font-size="16.5" font-weight="700">Speak naturally</text>
      <text x="465" y="250" fill="#8a7b70" font-size="12.5">Audio is captured on your own device</text>
    </g>

    <!-- 03 transcribe and clean -->
    <g>
      <circle cx="735" cy="140" r="32" fill="#f7e7c8" stroke="#e4cd9c"/>
      <g fill="#a9822f">
        <path d="M735 122c1.2 8.6 4.2 11.6 12.8 12.8-8.6 1.2-11.6 4.2-12.8 12.8-1.2-8.6-4.2-11.6-12.8-12.8 8.6-1.2 11.6-4.2 12.8-12.8Z"/>
        <path d="M748 146c.7 4.6 2.2 6.1 6.8 6.8-4.6.7-6.1 2.2-6.8 6.8-.7-4.6-2.2-6.1-6.8-6.8 4.6-.7 6.1-2.2 6.8-6.8Z"/>
      </g>
      <text x="735" y="200" fill="#a9822f" font-size="11" font-weight="700" letter-spacing="2.4">STEP 03</text>
      <text x="735" y="226" fill="#2b2422" font-size="16.5" font-weight="700">Transcribe &amp; clean</text>
      <text x="735" y="250" fill="#8a7b70" font-size="12.5">Local Parakeet V3, or the provider you pick</text>
    </g>

    <!-- 04 paste in place -->
    <g>
      <circle cx="1005" cy="140" r="32" fill="#2b2422"/>
      <g fill="#fffaf2">
        <rect x="990" y="127" width="30" height="5" rx="2.5"/>
        <rect x="990" y="137" width="22" height="5" rx="2.5"/>
        <rect x="990" y="147" width="26" height="5" rx="2.5"/>
      </g>
      <rect x="1018" y="144" width="3" height="12" rx="1.5" fill="#ef9a76"/>
      <text x="1005" y="200" fill="#7e7266" font-size="11" font-weight="700" letter-spacing="2.4">STEP 04</text>
      <text x="1005" y="226" fill="#2b2422" font-size="16.5" font-weight="700">Paste in place</text>
      <text x="1005" y="250" fill="#8a7b70" font-size="12.5">Text lands in the app that had focus</text>
    </g>
  </g>
</svg>
