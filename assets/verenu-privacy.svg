<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Verenu privacy model</title>
  <desc id="d">Keys, settings, history, dictionary, snippets and audio stay on your device. Data crosses the boundary only when you choose a cloud provider, and it never touches a Verenu server.</desc>

  <defs>
    <marker id="cross" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#d97757"/>
    </marker>
  </defs>

  <rect width="1200" height="300" rx="26" fill="#241d1b"/>
  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="25.25" fill="none" stroke="#3f332e"/>

  <text x="56" y="52" fill="#fffaf2" font-size="21" font-weight="700" letter-spacing="-.4">Privacy you can explain</text>
  <text x="56" y="76" fill="#a8968a" font-size="13.5">Local by default. Anything that leaves goes straight to the provider you picked.</text>

  <!-- your device -->
  <rect x="56" y="112" width="420" height="140" rx="20" fill="#2b2422" stroke="#4a3d37" stroke-dasharray="7 6"/>
  <circle cx="82" cy="141" r="4" fill="#5fae9d"/>
  <text x="96" y="146" fill="#8a7b70" font-size="11" font-weight="700" letter-spacing="2.4">YOUR DEVICE</text>
  <g text-anchor="middle" font-size="12.5" font-weight="600">
    <g fill="#352c28" stroke="#4a3d37">
      <rect x="80" y="162" width="116" height="34" rx="17"/>
      <rect x="208" y="162" width="116" height="34" rx="17"/>
      <rect x="336" y="162" width="116" height="34" rx="17"/>
      <rect x="80" y="204" width="116" height="34" rx="17"/>
      <rect x="208" y="204" width="116" height="34" rx="17"/>
      <rect x="336" y="204" width="116" height="34" rx="17"/>
    </g>
    <g fill="#d9c8bc" stroke="none">
      <text x="138" y="184">API keys</text>
      <text x="266" y="184">History</text>
      <text x="394" y="184">Settings</text>
      <text x="138" y="226">Dictionary</text>
      <text x="266" y="226">Snippets</text>
      <text x="394" y="226">Audio</text>
    </g>
  </g>

  <!-- boundary crossing -->
  <g stroke="#d97757" stroke-width="1.8" stroke-dasharray="6 6">
    <line x1="490" y1="182" x2="524" y2="182"/>
    <line x1="696" y1="182" x2="730" y2="182" marker-end="url(#cross)"/>
  </g>
  <rect x="530" y="165" width="160" height="34" rx="17" fill="#3a2620" stroke="#d97757"/>
  <text x="610" y="187" text-anchor="middle" fill="#ef9a76" font-size="12.5" font-weight="700">only if you opt in</text>
  <text x="610" y="219" text-anchor="middle" fill="#8a7b70" font-size="12">never a Verenu server</text>

  <!-- provider -->
  <rect x="744" y="112" width="400" height="140" rx="20" fill="#2b2422" stroke="#4a3d37"/>
  <circle cx="770" cy="141" r="4" fill="#ef9a76"/>
  <text x="784" y="146" fill="#8a7b70" font-size="11" font-weight="700" letter-spacing="2.4">PROVIDER YOU CHOOSE</text>
  <g text-anchor="middle" font-size="12.5" font-weight="600">
    <g fill="#352c28" stroke="#4a3d37">
      <rect x="768" y="162" width="110" height="34" rx="17"/>
      <rect x="890" y="162" width="110" height="34" rx="17"/>
      <rect x="1012" y="162" width="108" height="34" rx="17"/>
    </g>
    <g fill="#d9c8bc" stroke="none">
      <text x="823" y="184">Groq</text>
      <text x="945" y="184">OpenAI</text>
      <text x="1066" y="184">Google</text>
    </g>
  </g>
  <text x="768" y="226" fill="#a8968a" font-size="12.5">Only the audio or text for that one request, using your own key.</text>
</svg>
